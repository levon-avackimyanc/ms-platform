server:
  port: 8080

spring:
  application:
    name: logistics-planner
  datasource:
    url: jdbc:postgresql://localhost:5432/logistics
    username: logistics
    password: logistics
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  cache:
    type: caffeine
  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

maps:
  provider: stub
  api-key: ${MAPS_API_KEY:placeholder}

async:
  planning:
    core-pool-size: 4
    max-pool-size: 10
    queue-capacity: 50
