spring:
  application:
    name: ms-platform
  main:
    banner-mode: "off"
    web-application-type: none
  shell:
    interactive:
      enabled: false
    noninteractive:
      enabled: true
    history:
      enabled: false
    command:
      help:
        grouping-mode: group
    config:
      env-prefix: MS

  # Spring AI default ChatClient pulls config from spring.ai.openai.* — мы используем OpenAI-compatible проксю.
  # Реальные base-url / api-key для каждой модели прокидываются через профили (см. application-dev.yml позже)
  # и/или env-переменные. Здесь — минимальный валидный конфиг, чтобы старт не падал.
  ai:
    openai:
      base-url: ${MS_LLM_BASE_URL:https://api.openai.com}
      api-key:  ${MS_LLM_API_KEY:placeholder-replace-via-env}
      chat:
        options:
          model: ${MS_LLM_MODEL:gpt-4o-mini}

# Параметры платформы (наши, не Spring) — будем расширять по мере появления модулей.
ms:
  workspace:
    # Корневая директория, в которой живут ветки инкрементов целевых проектов.
    # На старте — рабочая директория, в которой запущен CLI.
    root: ${MS_WORKSPACE_ROOT:${user.dir}}
  tracing:
    # Локальный упрощённый трейсинг (см. ARCHITECTURE_PROPOSAL.md, раздел A, блок Tracing).
    enabled: true
    output-dir: ${MS_TRACES_DIR:${user.dir}/.platform-state/traces}

logging:
  level:
    root: WARN
    dev.multiagent.ms: INFO
    org.springframework.shell: WARN
  pattern:
    console: "%d{HH:mm:ss.SSS} %-5level %logger{36} - %msg%n"
