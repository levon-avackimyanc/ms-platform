server:
  port: 8080

spring:
  application:
    name: shortlink-service

# Базовый адрес для построения короткой ссылки: app.base-url + /r/ + code
app:
  base-url: http://localhost:8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"
